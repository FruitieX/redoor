name: Tests

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install pnpm and Node
              uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  cache: true
                  install: false

            # Reads the version from rust-toolchain.toml so CI and local builds share one pin.
            # It also configures Swatinem/rust-cache. Warnings stay warnings like local builds.
            - name: Install Rust
              uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
              with:
                  build-warnings: warn

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium

            # The create-archive Playwright tests write and read every offered archive format.
            - name: Install archive tools
              run: sudo apt-get install -y --no-install-recommends zstd zip unzip xz-utils

            - name: Install Toxiproxy
              run: |
                  curl --fail --location --retry 3 --output /tmp/toxiproxy-server https://github.com/Shopify/toxiproxy/releases/download/v2.13.0/toxiproxy-server-linux-amd64
                  chmod +x /tmp/toxiproxy-server
                  /tmp/toxiproxy-server > /tmp/toxiproxy.log 2>&1 &
                  curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8474/version

            - name: Build application
              run: pnpm run build

            - name: Run Cargo tests
              run: cargo test --locked

            - name: Run UI unit tests
              run: pnpm run test:unit

            - name: Run Vitest integration tests
              run: pnpm run integration-test

            - name: Run Playwright tests
              run: pnpm run playwright

            - name: Upload test diagnostics
              if: ${{ failure() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: test-diagnostics
                  path: |
                      log/
                      playwright-report/
                      test-results/
                      /tmp/toxiproxy.log
                  if-no-files-found: ignore

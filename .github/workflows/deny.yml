name: Cargo deny

on:
    push:
        branches:
            - main
    pull_request:
    # New RustSec advisories land without any change in this repository, so audit daily too.
    schedule:
        - cron: "17 5 * * *"
    workflow_dispatch:

jobs:
    cargo-deny:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                checks:
                    - advisories
                    - bans licenses sources
        # A freshly published advisory should not block unrelated pull requests; main and the
        # daily run still fail so the advisory gets noticed and fixed.
        continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Run cargo deny
              uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
              with:
                  command: check ${{ matrix.checks }}
                  arguments: --locked
